<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Points Des Clubs</title>
</head>
<body>
    <h1>Tableau des points des clubs</h1>
    <p><a href="{{ url_for('index') }}">Retour à l'accueil</a></p>
    
    <table border="1" cellpadding="10">
        <thead>
            <tr>
                <th>Nom du Club</th>
                <th>Points Disponibles</th>
            </tr>
        </thead>
        <tbody>
            {% for club in clubs %}
            <tr>
                <td>{{ club['name'] }}</td>
                <td>{{ club['points'] }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
